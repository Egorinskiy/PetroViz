upstream backend_server {
    server backend:8000;
}

server {
    listen 80;
    server_name petroviz.ru www.petroviz.ru;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name petroviz.ru www.petroviz.ru;

    ssl_certificate /etc/letsencrypt/live/petroviz.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/petroviz.ru/privkey.pem;

    client_max_body_size 50M;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend_server;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /docs {
        proxy_pass http://backend_server/docs;
        proxy_set_header Host $host;
    }
}