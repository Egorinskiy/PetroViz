name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  POSTGRES_USER: petroviz
  POSTGRES_PASSWORD: petroviz_ci_password
  PETROVIZ_DATABASE_URL: postgresql+asyncpg://petroviz:petroviz_ci_password@localhost:5432/petroviz_test
  PETROVIZ_TEST_DATABASE_URL: postgresql+asyncpg://petroviz:petroviz_ci_password@localhost:5432/petroviz_test
  PETROVIZ_JWT_SECRET: ci-test-jwt-secret-not-for-production

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: petroviz
          POSTGRES_PASSWORD: petroviz_ci_password
          POSTGRES_DB: petroviz
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U petroviz -d petroviz"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Create test database
        run: |
          PGPASSWORD="$POSTGRES_PASSWORD" psql -h localhost -U "$POSTGRES_USER" -d postgres \
            -c "CREATE DATABASE petroviz_test;"

      - name: Run pytest
        working-directory: backend
        run: pytest -q
